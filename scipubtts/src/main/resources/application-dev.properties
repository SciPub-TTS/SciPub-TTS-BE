server.port=${DEV_SERVER_PORT:8081}

spring.datasource.url=${DEV_DB_URL:jdbc:postgresql://localhost:5432/scipub_dev}
spring.datasource.username=${DEV_DB_USERNAME:postgres}
spring.datasource.password=${DEV_DB_PASSWORD:}

spring.mail.username=${DEV_MAIL_USERNAME:}
spring.mail.password=${DEV_MAIL_PASSWORD:}

spring.security.oauth2.client.registration.google.client-id=${DEV_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${DEV_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

app.jwt.secret=${DEV_JWT_SECRET:}
app.backend-base-url=${DEV_BACKEND_BASE_URL}

server.servlet.session.cookie.name=SCIPUB_SESSION_DEV
app.cors.allowed-origins=${DEV_CORS_ALLOWED_ORIGINS:http://localhost:5173}
server.servlet.session.cookie.secure=true
app.auth.refresh-cookie-secure=false
app.auth.refresh-cookie-same-site=Lax

logging.level.org.springframework.security=WARN