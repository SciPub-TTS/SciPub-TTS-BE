spring.application.name=Owlreka

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Genreal configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# CONFIGURATION FOR POSTGRESQL DATABASE
# ===================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
#For connection to SUPABASE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=none

# Enable Flyway migrations
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
spring.flyway.baseline-description=init_schema 
spring.flyway.out-of-order=${SPRING_FLYWAY_OUT_OF_ORDER:true}
# - never edit an old migration that already ran on the shared database
# - always create a brand-new versioned migration file
# - use timestamp-based versions so different branches do not fight over any V
# - if the database already has a newer migration from another branch, let Flyway ignore that
#   "future" migration locally until this branch pulls the missing file
spring.flyway.ignore-migration-patterns=${SPRING_FLYWAY_IGNORE_MIGRATION_PATTERNS:*:future}
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
logging.level.org.flywaydb=DEBUG

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CONFIGURATION FOR EMAIL SMTP
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# CONFIGURATION FOR GOOGLE AUTH
# ===================================================================
server.servlet.session.timeout=604800

logging.level.root=INFO
logging.level.com.brotherhood.scipubtts=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.cors=DEBUG

# ===================================================================
# APP CONFIG
# ===================================================================
server.port=${PORT:8080}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.jwt.secret=${APP_JWT_SECRET}

app.backend-base-url=${APP_BACKEND_BASE_URL:http://localhost:8080}
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.docs.public-enabled=${APP_DOCS_PUBLIC_ENABLED:false}

app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie-same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}

spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
