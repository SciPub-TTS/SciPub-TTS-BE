spring.application.name=scipubtts

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Genreal configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# CONFIGURATION FOR POSTGRESQL DATABASE
# ===================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# Enable Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CONFIGURATION FOR EMAIL SMTP
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# CONFIGURATION FOR GOOGLE AUTH
# ===================================================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=604800

logging.level.root=INFO
logging.level.com.brotherhood.scipubtts=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web.cors=DEBUG

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

app.frontend.oauth2-success-url=http://localhost:5173/oauth2/success

# Default base URLs – override per profile as needed
app.backend-base-url=http://localhost:8080

# Default refresh cookie settings (non-HTTPS, same-site=Lax)
app.auth.refresh-cookie-secure=false
app.auth.refresh-cookie-same-site=Lax

server.forward-headers-strategy=framework
springdoc.swagger-ui.config-url=/api/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/api/v3/api-docs
