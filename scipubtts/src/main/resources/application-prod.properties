# Archived on 2026-06-19 for Render deploy stability with Spring Boot 4.
# Enabling spring.datasource.hikari.* here caused Hikari to be rebound after
# the pool had already started, which then failed with "The configuration of
# the pool is sealed once started". Use Hikari defaults in production for now.
# spring.datasource.hikari.pool-name=owlreka-prod-hikari
# spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
# spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
# spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
# spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:600000}
# spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
app.frontend-base-url=${APP_FRONTEND_BASE_URL}
app.backend-base-url=${APP_BACKEND_BASE_URL}

server.servlet.session.cookie.name=OWLREKA_SESSION_PROD
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie-same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:None}

logging.level.root=INFO
logging.level.com.brotherhood.scipubtts=INFO
logging.level.org.springframework.security=WARN
