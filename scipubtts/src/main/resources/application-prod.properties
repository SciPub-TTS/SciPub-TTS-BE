server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.pool-name=scipub-prod-hikari
spring.datasource.hikari.data-source-properties.ApplicationName=scipub-prod-be
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:600000}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET}
app.backend-base-url=${APP_BACKEND_BASE_URL}

server.servlet.session.cookie.name=SCIPUB_SESSION_PROD
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

app.auth.refresh-cookie-secure=${APP_AUTH_REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie-same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:None}

logging.level.root=INFO
logging.level.com.brotherhood.scipubtts=INFO
logging.level.org.springframework.security=WARN
