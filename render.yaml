services:
  # Change plan to starter if you need Spring @Scheduled jobs to run reliably.
  - type: web
    name: owlreka-be
    runtime: docker
    plan: free
    region: singapore
    branch: prod
    dockerfilePath: ./scipubtts/Dockerfile
    dockerContext: ./scipubtts
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: SPRING_FLYWAY_BASELINE_ON_MIGRATE
        value: "false"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "10"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "2"
      - key: SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT
        value: "30000"
      - key: SPRING_DATASOURCE_HIKARI_MAX_LIFETIME
        value: "600000"
      - key: SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT
        value: "30000"
      - key: APP_AUTH_REFRESH_COOKIE_SECURE
        value: "true"
      - key: APP_AUTH_REFRESH_COOKIE_SAME_SITE
        value: None
      - key: APP_DOCS_PUBLIC_ENABLED
        value: "false"
      - key: SPRINGDOC_API_DOCS_ENABLED
        value: "true"
      - key: SPRINGDOC_SWAGGER_UI_ENABLED
        value: "true"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_FRONTEND_BASE_URL
        sync: false
      - key: APP_BACKEND_BASE_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_JWT_SECRET
        sync: false
